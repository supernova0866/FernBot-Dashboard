<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fern — Logging in...</title>
  <link rel="stylesheet" href="/core/style.css" />
</head>
<body style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:0">
  <div style="text-align:center">
    <div style="font-size:64px;margin-bottom:20px;animation:boop 1.8s ease-in-out infinite">🌿</div>
    <div style="font-family:'Grandstander',cursive;font-size:32px;font-weight:800;color:var(--text);margin-bottom:10px">
      Logging you in...
    </div>
    <div style="font-size:14px;color:var(--muted);font-weight:600">
      Hang tight, connecting to Discord
    </div>

    <!-- Loading dots -->
    <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:24px">
      <span class="pulse-dot"></span>
      <span class="pulse-dot" style="animation-delay:0.3s"></span>
      <span class="pulse-dot" style="animation-delay:0.6s"></span>
    </div>
  </div>

  <script src="/managers/toast.js"></script>
  <script src="/managers/auth.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');

      if (!code) {
        window.location.href = '/pages/home.html';
        return;
      }

      try {
        await Auth.handleCallback(code, state);
        window.location.href = '/pages/home.html';
      } catch (e) {
        console.error(e);
        window.location.href = '/pages/home.html';
      }
    })();
  </script>
</body>
</html>
